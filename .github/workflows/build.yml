name: Build

on:
  push:
    branches: '**'
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  Build:
    # net35/net48 and WPF test projects plus the msbuild.exe engine need Windows with Visual Studio.
    runs-on: windows-2025-vs2026
    env:
      Configuration: Release
      # The in-repo isolated test cache exceeds MAX_PATH under msbuild.exe on the runner's deep checkout path.
      # One run only ever sees one annotator version, so a shared short-path cache is safe here.
      TestPackages: ${{ github.workspace }}\..\p

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Nerdbank.GitVersioning needs the history
        persist-credentials: false

    - uses: actions/setup-dotnet@v5
      with:
        # 10.0.x: runtime for the net10.0 unit test project.
        dotnet-version: |
          10.0.x
          11.0.x
        dotnet-quality: 'preview'

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build and pack
      run: dotnet build ReferenceAssemblyAnnotator.slnx -c $env:Configuration

    - name: Unit tests
      run: dotnet test --project ICSharpCode.ReferenceAssemblyAnnotator.Tests -c $env:Configuration --no-build

    - name: Test (dotnet msbuild)
      run: ./build/test.ps1 -Configuration $env:Configuration -Engine dotnet -PackagesPath $env:TestPackages

    - name: Test (msbuild.exe)
      run: ./build/test.ps1 -Configuration $env:Configuration -Engine msbuild -PackagesPath $env:TestPackages

    - name: Upload NuGet package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: ICSharpCode.ReferenceAssemblyAnnotator/bin/${{ env.Configuration }}/*.nupkg
        if-no-files-found: error
